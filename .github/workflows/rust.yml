name: rust

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    name: fmt • clippy • test • doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup is pre-installed on GitHub runners and honours rust-toolchain.toml,
      # which pins the exact channel and installs the rustfmt + clippy components.
      - name: Show toolchain (triggers pinned install)
        run: |
          rustup show active-toolchain || rustup show
          rustc --version
          cargo --version

      - name: Format check
        run: cargo fmt --all --check

      - name: Required host conformance tools
        run: |
          g++ --version
          python3 --version
          # Required negative test: the launcher must reject privileged execution.
          sudo -n true

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Resolved deployment identity regressions and example
        run: |
          timeout --signal=TERM --kill-after=5s 60s cargo test --locked -p neuradix-graph
          timeout --signal=TERM --kill-after=5s 30s cargo test --locked -p neuradix-cli --test graph
          timeout --signal=TERM --kill-after=5s 30s cargo run --locked -p neuradix-graph --example resolved_identity
          timeout --signal=TERM --kill-after=5s 30s cargo run --locked -p neuradix-graph --example delayed_feedback

      - name: Program replay regressions and example
        run: |
          timeout --signal=TERM --kill-after=5s 60s cargo test --locked -p neuradix-runtime
          timeout --signal=TERM --kill-after=5s 30s cargo run --locked -p neuradix-runtime --example program_replay

      - name: Guarded actuator regressions and example
        run: |
          timeout --signal=TERM --kill-after=5s 60s cargo test --locked -p neuradix-safety --test actuator
          timeout --signal=TERM --kill-after=5s 30s cargo run --locked -p neuradix-safety --example guarded_actuator

      - name: Embedded actuator permission regressions and example
        run: |
          timeout --signal=TERM --kill-after=5s 60s cargo test --locked -p neuradix-embedded-core -p neuradix-example-embedded-actuator-target
          timeout --signal=TERM --kill-after=5s 30s cargo run --locked -p neuradix-example-embedded-propulsion

      # The self dev-dependency and dev-dependency features enable `provisioning`
      # for these test builds without `--features`.
      - name: Generation reservation regressions and example
        run: |
          timeout --signal=TERM --kill-after=5s 90s cargo test --locked -p neuradix-command-core --lib --test reservation --test reservation_faults --test reservation_alloc
          timeout --signal=TERM --kill-after=5s 60s cargo test --locked -p neuradix-embedded-core --test reservation --test actuator_alloc
          timeout --signal=TERM --kill-after=5s 90s cargo test --locked -p neuradix-safety --lib --test reservation
          timeout --signal=TERM --kill-after=5s 30s cargo run --locked -p neuradix-safety --example reserved_startup

      # Hard cap: also runs the default reservation sweeps and the host subprocess suite.
      - name: Trusted command regressions
        run: timeout --signal=TERM --kill-after=5s 300s cargo test --locked -p neuradix-command-core -p neuradix-safety -p neuradix-embedded-core -p neuradix-embedded-transport

      - name: Compact channel binding regressions
        run: |
          timeout --signal=TERM --kill-after=5s 60s cargo test --locked -p neuradix-contracts --test channel_manifest
          timeout --signal=TERM --kill-after=5s 60s cargo test --locked -p neuradix-embedded-transport --test channel
          timeout --signal=TERM --kill-after=5s 60s cargo test --locked -p neuradix-embedded-codegen --test channel_binding --test golden

      - name: Legacy scalar recording migration regressions
        run: |
          timeout --signal=TERM --kill-after=5s 60s cargo test --locked -p neuradix-record --test legacy_migration
          timeout --signal=TERM --kill-after=5s 60s cargo test --locked -p neuradix-cli --test record

      - name: Independent MCAP fixtures and bounded import
        run: |
          python3 -m venv /tmp/a06-fixtures
          /tmp/a06-fixtures/bin/pip install -r crates/record/tests/fixtures/requirements.txt
          timeout --signal=TERM --kill-after=5s 60s /tmp/a06-fixtures/bin/python crates/record/tests/fixtures/generate.py --check --memory /tmp/a06-memory
          timeout --signal=TERM --kill-after=5s 120s cargo test --locked -p neuradix-record
          cargo build --locked -p neuradix-record --example mcap_import_memory
          timeout --signal=TERM --kill-after=5s 90s python3 crates/record/tests/fixtures/memory.py target/debug/examples/mcap_import_memory /tmp/a06-memory

      - name: Independent MCAP export and bounded writer memory
        run: |
          cargo build --locked -p neuradix-record --example mcap_export
          timeout --signal=TERM --kill-after=5s 90s /tmp/a06-fixtures/bin/python crates/record/tests/fixtures/verify_export.py target/debug/examples/mcap_export

      - name: Bounded Python worker regressions (external timeout)
        run: |
          timeout --signal=TERM --kill-after=5s 120s cargo test --locked -p neuradix-python
          timeout --signal=TERM --kill-after=5s 30s python3 -B -m unittest discover -s python/tests -v

      - name: Tests (workspace)
        run: timeout --signal=TERM --kill-after=5s 180s cargo test --locked --workspace

      - name: Migrated command examples
        run: |
          cargo run --locked -p neuradix-example-minimal-depth-stream
          cargo run --locked -p neuradix-example-auv-depth-sim
          cargo run --locked -p neuradix-example-embedded-propulsion
          cargo build --locked -p neuradix-python --bin neuradix-python-launcher
          timeout --signal=TERM --kill-after=5s 30s cargo run --locked -p neuradix-example-python-worker -- target/debug/neuradix-python-launcher

      - name: Embedded no_std configuration
        run: |
          cargo check --locked -p neuradix-time --no-default-features
          cargo check --locked -p neuradix-command-core --no-default-features
          # The trusted provisioning build is warning-free under no_std too.
          cargo check --locked -p neuradix-command-core --no-default-features --features provisioning
          cargo check --locked -p neuradix-embedded-transport --no-default-features
          cargo check --locked -p neuradix-embedded-core --no-default-features
          cargo check --locked -p neuradix-example-embedded-actuator-target --no-default-features

      - name: Docs (no deps)
        run: cargo doc --locked --workspace --no-deps

      - name: Show proposed format and golden changes on failure
        if: failure()
        run: |
          cargo fmt --all
          UPDATE_GOLDEN=1 cargo test --locked -p neuradix-embedded-codegen --test golden || true
          git diff -- Cargo.lock crates examples

  # Parallel release fault campaign, off the serial build-test critical path.
  # Target: F6-F8 under 120 s; 420 s is a hard cap that includes compilation.
  reservation-faults:
    name: Generation reservation fault campaign (release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain (triggers pinned install)
        run: |
          rustup show active-toolchain || rustup show
          rustc --version
      - name: Release fault sweeps F6-F8 (exact case counts asserted and printed)
        run: timeout --signal=TERM --kill-after=5s 420s cargo test --locked --release -p neuradix-command-core --test reservation_faults -- --ignored --nocapture

  mcu-actuator:
    name: MCU actuator cross-compilation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned bare-metal targets and LLVM tools
        run: |
          rustup show active-toolchain || rustup show
          rustup target add thumbv6m-none-eabi thumbv7em-none-eabihf riscv32imc-unknown-none-elf
          rustup component add llvm-tools
      - name: Build no_std actuator boundary and scan for heap allocator references
        run: timeout --signal=TERM --kill-after=5s 300s ./tools/ci/mcu_actuator.sh

  avr-codegen:
    name: Arduino Uno codec ABI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install AVR conformance toolchain
        run: |
          # Only signed Ubuntu sources are needed for AVR; unrelated runner
          # Chrome repositories have produced persistent index hash mismatches.
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo apt-get install --no-install-recommends -y gcc-avr avr-libc binutils-avr
          avr-g++ --version
          avr-size --version
      - name: Verify actual ATmega328P numeric ABI and supported scalar build
        run: cargo test --locked -p neuradix-embedded-codegen --test avr -- --ignored --nocapture
