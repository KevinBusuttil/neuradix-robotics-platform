name: rust

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    name: fmt • clippy • test • doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup is pre-installed on GitHub runners and honours rust-toolchain.toml,
      # which pins the exact channel and installs the rustfmt + clippy components.
      - name: Show toolchain (triggers pinned install)
        run: |
          rustup show active-toolchain || rustup show
          rustc --version
          cargo --version

      - name: Format check
        run: cargo fmt --all --check

      - name: Required host conformance tools
        run: |
          g++ --version
          python3 --version

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests (workspace)
        run: cargo test --locked --workspace

      - name: Docs (no deps)
        run: cargo doc --locked --workspace --no-deps

      - name: Show proposed format and golden changes on failure
        if: failure()
        run: |
          cargo fmt --all
          UPDATE_GOLDEN=1 cargo test --locked -p neuradix-embedded-codegen --test golden || true
          git diff -- crates

  avr-codegen:
    name: Arduino Uno codec ABI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install AVR conformance toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-avr avr-libc binutils-avr
          avr-g++ --version
          avr-size --version
      - name: Verify actual ATmega328P numeric ABI and supported scalar build
        run: cargo test --locked -p neuradix-embedded-codegen --test avr -- --ignored --nocapture
